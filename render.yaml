services:
  - type: web
    name: control-acceso-nusefa
    runtime: node
    repo: https://github.com/anfemasena/control-acceso-rfid
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: DATA_DIR
        value: /tmp/control-acceso-data
