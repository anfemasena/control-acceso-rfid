name: NUSEFA – pruebas de registros
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/nusefa-registros-seguros]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: PostgreSQL local para pruebas
        run: |
          docker run -d --name nusefa-pg -e POSTGRES_PASSWORD=prueba -e POSTGRES_USER=nusefa -e POSTGRES_DB=nusefa -p 127.0.0.1:5433:5432 postgres:17-alpine
          for i in $(seq 1 30); do docker exec nusefa-pg pg_isready -U nusefa -d nusefa && break; sleep 1; done
      - name: Integracion PostgreSQL
        env:
          DATABASE_URL: postgresql://nusefa:prueba@127.0.0.1:5433/nusefa
        run: node tests/postgres.test.js
